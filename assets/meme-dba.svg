<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" font-family="Consolas, 'Fira Code', monospace">
  <style>
    .t{fill:#c0caf5;font-size:14px}
    .k{fill:#7aa2f7}.r{fill:#f7768e}.g{fill:#9ece6a}.c{fill:#565f89;font-style:italic}
    .l{opacity:0;animation:show 12s infinite}
    .l1{animation-delay:.5s}.l2{animation-delay:2s}.l3{animation-delay:3.5s}.l4{animation-delay:5s}.l5{animation-delay:6.5s}
    @keyframes show{0%{opacity:0}3%{opacity:1}85%{opacity:1}90%{opacity:0}100%{opacity:0}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="420" height="250" rx="12" fill="#1a1b26"/>
  <rect width="420" height="34" rx="12" fill="#24283b"/><rect y="22" width="420" height="12" fill="#24283b"/>
  <circle cx="20" cy="17" r="6" fill="#f7768e"/><circle cx="40" cy="17" r="6" fill="#e0af68"/><circle cx="60" cy="17" r="6" fill="#9ece6a"/>
  <text x="210" y="22" text-anchor="middle" class="c" font-size="12">sqlplus — PRODUCAO</text>
  <text x="20" y="70" class="t l l1"><tspan class="k">SQL&gt;</tspan> DELETE FROM vendas;</text>
  <text x="20" y="98" class="t l l2"><tspan class="r">1000000 rows deleted.</tspan></text>
  <text x="20" y="126" class="t l l3"><tspan class="k">SQL&gt;</tspan> -- pera... cadê o WHERE?</text>
  <text x="20" y="154" class="t l l4"><tspan class="k">SQL&gt;</tspan> <tspan class="g">ROLLBACK;</tspan></text>
  <text x="20" y="182" class="t l l5"><tspan class="g">Rollback complete.</tspan> ufa 😮‍💨</text>
  <text x="20" y="226" class="c" font-size="12">// por isso todo DBA ama autocommit off</text>
  <rect x="330" y="212" width="9" height="16" fill="#c0caf5" class="cur"/>
</svg>
